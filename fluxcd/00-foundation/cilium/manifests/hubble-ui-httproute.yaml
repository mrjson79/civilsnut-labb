---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: cilium
spec:
  hostnames:
    - hubble.civilsnut.se
  parentRefs:
    - group: gateway.networking.k8s.io
      name: shared-gateway
      kind: Gateway
      namespace: gateway-system
  rules:
    # oauth2-proxy's own endpoints (sign-in, callback) must stay anonymous -
    # no ExternalAuth filter here; longest-prefix-match wins over the
    # catch-all rule below
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - group: ""
          kind: Service
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oauth2-proxy
              namespace: oauth2-proxy
              port: 80
            http:
              # cookie carries the session, accept decides 302-vs-401;
              # no path prefix - the check must mirror the original path
              allowedHeaders:
                - cookie
                - accept
              allowedResponseHeaders:
                - authorization
                - x-auth-request-user
                - x-auth-request-email
                - x-auth-request-groups
                - x-auth-request-preferred-username
      backendRefs:
        - group: ""
          kind: Service
          name: hubble-ui
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: hubble-ui-to-shared-gateway
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: cilium
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: "gateway.networking.k8s.io"
      kind: Gateway
      name: shared-gateway
