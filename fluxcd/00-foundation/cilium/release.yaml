apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Preserve 1.19 datapath defaults across the 1.20 minor upgrade
    upgradeCompatibility: "1.19"

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    cluster:
      name: civilsnut-labbet

    externalIPs:
      enabled: true
      l2announcements:
        enabled: true

    gatewayAPI:
      enableAlpn: true
      enableAppProtocol: true
      enabled: true

    bgpControlPlane:
      enabled: true

    ipam:
      mode: kubernetes

    k8sClientRateLimit:
      burst: 40
      qps: 20

    k8sServiceHost: localhost
    k8sServicePort: 7445

    kubeProxyReplacement: true

    l2announcements:
      enabled: true

    loadBalancer:
      l2:
        enabled: true

    routingMode: tunnel

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    tunnelProtocol: vxlan

    # Prometheus metrics
    prometheus:
      enabled: true
      port: 9962
      serviceMonitor:
        enabled: true  # Using VMServiceScrape instead

    operator:
      replicas: 1
      prometheus:
        enabled: true
        port: 9963
        serviceMonitor:
          enabled: false  # Using VMServiceScrape instead

    envoy:
      prometheus:
        enabled: true
        port: "9964"
        serviceMonitor:
          enabled: false  # Using VMServiceScrape instead

    # Hubble configuration
    hubble:
      enabled: true
      metrics:
        # labelsContext adds source/destination namespace (and workload for HTTP)
        # to the hubble metrics - required by the Hubble namespace/workload
        # Grafana dashboards. Cardinality cost is bounded: ~13 namespaces and a
        # few dozen workloads. Deliberately NOT adding source_ip/destination_ip,
        # which would explode cardinality per pod IP.
        # httpV2 replaces http (mutually exclusive): responses fold into
        # hubble_http_requests_total as a status label, which the L7-by-workload
        # dashboard requires. Costs one panel on the main Hubble dashboard that
        # still reads hubble_http_responses_total.
        # NOTE: dns metrics only appear once cilium's DNS proxy actually observes
        # queries (toFQDNs policy / DNS visibility) - none exist today.
        enabled:
          - dns:query;labelsContext=source_namespace,destination_namespace
          - drop:labelsContext=source_namespace,destination_namespace
          - tcp:labelsContext=source_namespace,destination_namespace
          - flow:labelsContext=source_namespace,destination_namespace
          - icmp:labelsContext=source_namespace,destination_namespace
          - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      relay:
        enabled: true
        rollOutPods: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: false
