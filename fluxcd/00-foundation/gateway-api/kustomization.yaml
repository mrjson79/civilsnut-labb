apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Keep the experimental channel: ExternalAuth requires it.
  # Renovate updates this pinned release URL and both README version tables.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/experimental-install.yaml

# Preserve the existing exclusion: this upstream policy blocks experimental
# CRDs over standard-channel installations. Do not reintroduce it via Flux.
patches:
  - patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: safe-upgrades.gateway.networking.k8s.io
  - patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: safe-upgrades.gateway.networking.k8s.io
