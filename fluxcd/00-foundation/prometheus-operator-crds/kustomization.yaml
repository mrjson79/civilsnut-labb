apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Install prometheus-operator CRDs before the kube-prometheus-stack HelmRelease
  # This ensures ServiceMonitor, PodMonitor, PrometheusRule, etc. CRDs are available
  # for dry-run validation. Version matches the operator bundled in
  # kube-prometheus-stack 87.8.0 (appVersion v0.92.1).
  - https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.93.0/stripped-down-crds.yaml
