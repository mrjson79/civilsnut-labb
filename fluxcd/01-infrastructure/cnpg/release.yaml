# CloudNativePG operator - manages postgres Cluster CRs (zitadel-pg).
# The operator is stateless; has-disk pinning just keeps it near the
# clusters it manages (repo convention for anything RBD-adjacent).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nodeSelector:
      has-disk: "yes"
    monitoring:
      podMonitorEnabled: true
