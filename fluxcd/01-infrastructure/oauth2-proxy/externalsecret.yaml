# 1Password item oauth2-proxy-oidc:
#   client_id / client_secret: the confidential "oauth2-proxy" Web app in
#   the Zitadel homelab project
#   cookie_secret: openssl rand -base64 32 | tr -- '+/' '-_'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-oidc
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-oidc
    creationPolicy: Owner
  data:
    # key names are what the chart's existingSecret expects
    - secretKey: client-id
      remoteRef:
        key: oauth2-proxy-oidc
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: oauth2-proxy-oidc
        property: client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy-oidc
        property: cookie_secret
