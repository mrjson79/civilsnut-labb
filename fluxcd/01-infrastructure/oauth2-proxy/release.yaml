apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  interval: 5m
  chart:
    spec:
      chart: oauth2-proxy
      version: "10.7.0"
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: oauth2-proxy
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    config:
      # keys: client-id, client-secret, cookie-secret
      existingSecret: oauth2-proxy-oidc

    # ext_authz HTTP auth service for the Gateway API ExternalAuth filter.
    # Proxy mode with a static 200 upstream: Envoy sends the check request
    # with the ORIGINAL path; a valid session returns 200 (allow - it must
    # be 200, Envoy only allows on 200), no session returns a 302 to
    # /oauth2/start which Envoy forwards to the browser. Every protected
    # HTTPRoute carries a filterless /oauth2 rule to this service for the
    # login/callback endpoints.
    extraArgs:
      provider: oidc
      oidc-issuer-url: https://idp.civilsnut.se
      code-challenge-method: S256
      email-domain: "*"
      upstream: static://200
      # trust X-Forwarded-* from the gateway so redirect_uri derives per host
      reverse-proxy: "true"
      cookie-domain: .civilsnut.se
      whitelist-domain: .civilsnut.se
      cookie-secure: "true"
      set-xauthrequest: "true"
      skip-provider-button: "true"

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
