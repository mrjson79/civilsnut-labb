apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 5m
  timeout: 30m
  dependsOn:
    - name: rook-ceph-operator
  chart:
    spec:
      chart: rook-ceph-cluster
      # Pinned to match the operator. Previously unpinned, which let Flux pull
      # any new chart release - and since cephImage.tag is a chart default that
      # would silently start a rolling Ceph upgrade, and can silently re-enable
      # alerts that prometheusRuleOverrides disables by exact name.
      version: "v1.20.4"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Pinned explicitly: this is otherwise a chart default, so a chart bump would
    # roll a Ceph upgrade on a 4-OSD size:2 cluster unattended. Must be bumped
    # together with the ceph-mixin dashboard URLs in
    # 02-applications/monitoring/kube-prometheus-stack.yaml.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.2

    # Ceph CLI pod for investigating alerts: most ceph-mixin alert descriptions
    # tell you to run `ceph health detail`, and CephDaemonCrash cannot be cleared
    # without `ceph crash archive-all`. Note it mounts the client.admin keyring,
    # so `kubectl exec` into it is full cluster admin.
    toolbox:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    cephClusterSpec:
      dataDirHostPath: /var/lib/rook
      # Kept deliberately (chart default, but pinned here so it is a decision):
      # Loki's PVC is on ceph-block, so if ceph degrades enough to stall RBD I/O
      # then Loki can neither ingest nor be queried - the logs needed to diagnose
      # ceph become unavailable exactly when ceph breaks. These on-host files are
      # readable via talosctl with no ceph, no Loki and no apiserver in the path.
      # 100M (chart default 500M) bounds the footprint on Talos's EPHEMERAL
      # partition, which is the system disk, not the OSD NVMe.
      logCollector:
        enabled: true
        periodicity: daily
        maxLogSize: 100M
      mon:
        count: 3
        allowMultiplePerNode: false
      mgr:
        count: 2
        allowMultiplePerNode: false
      dashboard:
        enabled: true
        ssl: false
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: wrk-01
            devices:
              - name: nvme0n1
          - name: wrk-02
            devices:
              - name: nvme0n1
          - name: wrk-03
            devices:
              - name: nvme0n1
          - name: wrk-04
            devices:
              - name: nvme0n1
      placement:
        all:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: has-disk
                      operator: In
                      values:
                        - "yes"
      resources:
        mon:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        mgr:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 2
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystems: []
    # RGW for in-cluster S3 - first consumer is CNPG WAL archiving/backups
    # (bucket via ObjectBucketClaim + the ceph-bucket StorageClass below).
    # NOTE: same ceph cluster as the data it backs up - an offsite mirror is
    # still the plan for real DR.
    cephObjectStores:
      - name: objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 2
          dataPool:
            failureDomain: host
            replicated:
              size: 2
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 1
            placement:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: has-disk
                          operator: In
                          values: ["yes"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
        ingress:
          enabled: false
    monitoring:
      enabled: true
      # Sets BOTH the ServiceMonitor scrape interval AND the mgr's own metrics
      # cache TTL (mgr/prometheus/scrape_interval). 15s is the mgr's natural
      # cache period, so every scrape returns fresh data and no sample is a
      # duplicate; the operator default of 10s re-reads the same cached payload.
      # Changing this field also bumps the CephCluster generation, which forces
      # the operator to reconcile and create both ServiceMonitors immediately.
      interval: 15s
      # Ceph's own ceph-mixin alerts (89). Their thresholds are mostly
      # ceph_health_detail{name="X"} == 1, i.e. Ceph decides when NEARFULL /
      # PG_NOT_DEEP_SCRUBBED / MON_DISK_LOW is true using its configured ratios -
      # which cannot be reproduced faithfully in hand-written PromQL.
      # 46 are disabled below and 3 retuned, leaving 43.
      # NOTE: overrides match by EXACT alert name and a typo is silently
      # ignored, so re-check the rendered rule count after any chart bump:
      #   kubectl get --raw ".../api/v1/rules?type=alert" | jq '[.data.groups[]
      #     |select(.file|test("prometheus-ceph-rules"))|.rules[].name]|length'
      createPrometheusRules: true
      prometheusRuleOverrides:
        # --- BROKEN OR GUARANTEED-NOISY IN THIS CLUSTER ---
        # Cilium's cilium_vxlan (1450) and lxc* veths sit alongside eth0 (1500),
        # so "MTU differs from the cluster median" is permanently true.
        CephNodeInconsistentMTU: {disabled: true}
        # Selector is device!="lo", which includes every lxc* veth; drops and
        # errors on veth pairs are routine.
        CephNodeNetworkPacketDrops: {disabled: true}
        CephNodeNetworkPacketErrors: {disabled: true}
        # Talos / is a read-only image: either excluded by the exporter's
        # fs-type filter (dead rule) or reported ~100% used (fires forever).
        CephNodeRootFilesystemFull: {disabled: true}
        # Duplicates kube-prometheus-stack's better-tuned
        # NodeFilesystemSpaceFillingUp, which is already active.
        CephNodeDiskspaceWarning: {disabled: true}
        # No bonded interfaces -> node_bonding_* absent -> dead rule.
        CephNodeNetworkBondDegraded: {disabled: true}
        # Silently impossible: joins ceph_osd_numpg (job=rook-ceph-exporter) to
        # ceph_osd_metadata (job=rook-ceph-mgr) on (cluster, job, ceph_daemon),
        # and those job labels can never match. Low stakes on 4 identical NVMe.
        CephPGImbalance: {disabled: true}

        # --- DEAD WEIGHT: metric families never emitted here ---
        # CephFS not deployed (cephFileSystems: [], csi.enableCephfsDriver false)
        CephFilesystemDamaged: {disabled: true}
        CephFilesystemOffline: {disabled: true}
        CephFilesystemDegraded: {disabled: true}
        CephFilesystemMDSRanksLow: {disabled: true}
        CephFilesystemInsufficientStandby: {disabled: true}
        CephFilesystemFailureNoStandby: {disabled: true}
        CephFilesystemReadOnly: {disabled: true}
        # No rbd-mirror daemon
        CephRBDMirrorImagesPerDaemonHigh: {disabled: true}
        CephRBDMirrorImagesNotInSync: {disabled: true}
        CephRBDMirrorImagesNotInSyncVeryHigh: {disabled: true}
        CephRBDMirrorImageTransferBandwidthHigh: {disabled: true}
        # No NVMe-oF gateway
        NVMeoFSubsystemNamespaceLimit: {disabled: true}
        NVMeoFMultipleNamespacesOfRBDImage: {disabled: true}
        NVMeoFTooManyGateways: {disabled: true}
        NVMeoFMaxGatewayGroupSize: {disabled: true}
        NVMeoFMaxGatewayGroups: {disabled: true}
        NVMeoFSingleGateway: {disabled: true}
        NVMeoFHighGatewayCPU: {disabled: true}
        NVMeoFGatewayOpenSecurity: {disabled: true}
        NVMeoFTooManySubsystems: {disabled: true}
        NVMeoFTooManyNamespaces: {disabled: true}
        NVMeoFVersionMismatch: {disabled: true}
        NVMeoFHighClientCount: {disabled: true}
        NVMeoFMissingListener: {disabled: true}
        NVMeoFZeroListenerSubsystem: {disabled: true}
        NVMeoFHighHostCPU: {disabled: true}
        NVMeoFInterfaceDown: {disabled: true}
        NVMeoFInterfaceDuplex: {disabled: true}
        NVMeoFHighReadLatency: {disabled: true}
        NVMeoFHighWriteLatency: {disabled: true}
        NVMeoFHostKeepAliveTimeout: {disabled: true}
        # HARDWARE_* health checks come from cephadm's node-proxy (Redfish/BMC),
        # which rook does not deploy - never emitted under rook.
        HardwareStorageError: {disabled: true}
        HardwareMemoryError: {disabled: true}
        HardwareProcessorError: {disabled: true}
        HardwareNetworkError: {disabled: true}
        HardwarePowerError: {disabled: true}
        HardwareFanError: {disabled: true}
        # CEPHADM_CERT_* - cephadm cert-mgr only
        CephCertificateError: {disabled: true}
        CephCertificateWarning: {disabled: true}

        # --- RETUNED, not disabled ---
        # Upstream expr is up{job="ceph"} == 0, but rook's job label is
        # rook-ceph-mgr, so this "the metrics pipeline is dead" alert can never
        # fire as shipped. Worth fixing rather than losing.
        CephMgrPrometheusModuleInactive:
          expr: 'up{job="rook-ceph-mgr"} == 0'
        # Ships with no `for:`, so 1 of 4 OSDs down = 25% >= 10% => instant
        # critical on every Talos node reboot or OSD restart.
        CephOSDDownHigh:
          for: 15m
        # Catch-all for any HEALTH_WARN, including transient scrub lag and
        # reboots. Keep it (nothing else nets unclassified warnings) but stop it
        # paging for every node reboot.
        CephHealthWarning:
          for: 1h
