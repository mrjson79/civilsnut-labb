apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: rook-ceph
  annotations:
    flux.weave.works/depends-on: "cert-manager"
resources:
  - namespace.yaml
  - repository.yaml
  - csi-driver-rbac.yaml
  - operator-release.yaml
  - cluster-release.yaml
  - httproute.yaml
  - referencegrant.yaml
  # servicemonitor.yaml removed deliberately: the rook operator now owns both the
  # rook-ceph-mgr and rook-ceph-exporter ServiceMonitors (see monitoring.enabled
  # in operator-release.yaml). Its versions set honorLabels: true and relabel
  # cluster="rook-ceph", both of which the ceph-mixin dashboards require. Keeping
  # a copy here would fight the operator on every reconcile.
