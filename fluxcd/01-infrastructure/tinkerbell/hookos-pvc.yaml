# Storage for the HookOS artifacts served by the osie (nginx) deployment.
# The HookOS downloader runs as a SIDECAR in the single-replica osie pod and
# writes into the same volume nginx serves from — so ReadWriteOnce on the
# rook-ceph block class is sufficient (no CephFS/RWX required).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hook-artifacts
  namespace: tinkerbell
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      # 10Gi: HookOS, the flatcarctl-baked install images (~813M-1.2G zst
      # each), AND the component sysexts this volume now mirrors for day-2
      # upgrades — nodeagent.service fetches <name>-<version>-<arch>.raw from
      # http://192.168.1.141:7173 (FLATCARCTL_SYSEXT_BASE_URL in both
      # Tinkerbell templates). 4Gi hit 86% during the v1.37.0 upgrade.
      storage: 10Gi
