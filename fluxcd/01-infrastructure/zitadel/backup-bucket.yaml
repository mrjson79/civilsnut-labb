# S3 bucket for CNPG backups of zitadel-pg. Rook's bucket provisioner
# creates the bucket on the objectstore RGW and materialises, in this
# namespace, a Secret (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) and a
# ConfigMap (BUCKET_NAME/BUCKET_HOST) both named zitadel-pg-backups.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: zitadel-pg-backups
  namespace: zitadel
spec:
  bucketName: zitadel-pg-backups
  storageClassName: ceph-bucket
