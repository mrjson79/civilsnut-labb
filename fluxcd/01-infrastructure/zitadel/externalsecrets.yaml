# 1Password items (create before this lands - gate M1):
#   zitadel-masterkey: field "masterkey" = exactly 32 chars, e.g.
#     tr -dc A-Za-z0-9 </dev/urandom | head -c 32
#     The masterkey encrypts all Zitadel secrets at rest and CANNOT be
#     rotated or recovered - the 1Password item is the single copy.
#   zitadel-postgres: fields "password" (app user) and "postgres-password"
#     (superuser) - key names expected by the Bitnami postgresql subchart.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel-masterkey
        property: masterkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-postgres
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: zitadel-postgres
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: zitadel-postgres
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: zitadel-postgres
        property: postgres-password
