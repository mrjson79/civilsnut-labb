apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 5m
  # init + setup Jobs run as helm hooks; the first install migrates the DB
  timeout: 20m
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: zitadel
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    zitadel:
      masterkeySecretName: zitadel-masterkey
      configmapConfig:
        ExternalDomain: idp.civilsnut.se
        ExternalPort: 443
        # TLS terminates at the shared gateway; the pod serves h2c
        ExternalSecure: true
        TLS:
          Enabled: false

    # Zitadel v4 login UI is a separate deployment (service zitadel-login:3000)
    login:
      enabled: true
      replicaCount: 1

    postgresql:
      enabled: true
      auth:
        database: zitadel
        username: zitadel
        # keys: password, postgres-password
        existingSecret: zitadel-postgres
      primary:
        persistence:
          # chart default is FALSE - without this the IdP database is ephemeral
          enabled: true
          storageClass: ceph-block
          size: 10Gi
