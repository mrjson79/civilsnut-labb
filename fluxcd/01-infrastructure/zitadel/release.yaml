apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 5m
  # init + setup Jobs run as helm hooks; the first install migrates the DB
  timeout: 20m
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: zitadel
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # DB passwords come from the ESO-synced zitadel-postgres secret rather
  # than plaintext values in git; the chart turns secretConfig into a Secret
  valuesFrom:
    - kind: Secret
      name: zitadel-postgres
      valuesKey: password
      targetPath: zitadel.secretConfig.Database.Postgres.User.Password
    - kind: Secret
      name: zitadel-postgres
      valuesKey: postgres-password
      targetPath: zitadel.secretConfig.Database.Postgres.Admin.Password
  values:
    replicaCount: 1

    zitadel:
      masterkeySecretName: zitadel-masterkey
      configmapConfig:
        ExternalDomain: idp.civilsnut.se
        ExternalPort: 443
        # TLS terminates at the shared gateway; the pod serves h2c
        ExternalSecure: true
        TLS:
          Enabled: false
        # separate single-node Postgres in postgres.yaml - see comment there
        # for why the bundled subchart cannot work (pre-install hook deadlock)
        Database:
          Postgres:
            Host: zitadel-db
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: postgres
              SSL:
                Mode: disable

    # Zitadel v4 login UI is a separate deployment (service zitadel-login:3000)
    login:
      enabled: true
      replicaCount: 1
