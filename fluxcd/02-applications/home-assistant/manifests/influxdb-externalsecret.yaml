# Reuses the "influxdb" 1Password item (civilsnut.se vault) created for the
# InfluxDB deployment in the monitoring namespace.
# Follow-up: replace admin-token with a scoped write-only token (create in the
# Influx UI, add as a new field on the 1Password item, repoint property here).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-influxdb
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: home-assistant-influxdb
    creationPolicy: Owner
  data:
    - secretKey: INFLUXDB_TOKEN
      remoteRef:
        key: influxdb
        property: admin-token
