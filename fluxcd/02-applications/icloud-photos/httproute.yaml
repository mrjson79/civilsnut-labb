# TLS comes from the shared *.civilsnut.se wildcard on the gateway, so no
# per-app Certificate. DNS is manual: CNAME photos.civilsnut.se ->
# local.civilsnut.se in Cloudflare (no external-dns in this cluster).
#
# Deliberately unauthenticated, like ha.civilsnut.se: the page is embedded in an
# iframe on the HA dashboard, and an oauth2-proxy login redirect inside an iframe
# is blocked by the IdP's frame-ancestors policy whenever there is no live
# session - exactly the wall-tablet case. Reachable on the LAN only.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: icloud-photos
  namespace: icloud-photos
spec:
  hostnames:
    - photos.civilsnut.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: icloud-photos
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
