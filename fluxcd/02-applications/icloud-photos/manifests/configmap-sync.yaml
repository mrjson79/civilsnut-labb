# Mirrors a public iCloud Shared Album into /data for nginx to serve.
#
# Apple's shared-album API is undocumented but long-stable:
#   1. POST {base}/webstream  {"streamCtag": null}       -> album metadata
#      A HTTP 330 reply means "wrong partition"; the body carries
#      X-Apple-MMe-Host, rebuild {base} with that host and retry.
#   2. Pick the largest derivative per photo, note its checksum.
#   3. POST {base}/webasseturls  {"photoGuids": [...]}   -> signed download URLs
#      keyed by checksum: https://{url_location}{url_path}
#
# The checksum is content-addressed, so it doubles as the filename and the cache
# key - a re-sync only downloads genuinely new photos. Stdlib only, no pip.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: icloud-photos-sync
  namespace: icloud-photos
  labels:
    app: icloud-photos
data:
  sync.py: |
    #!/usr/bin/env python3
    """Mirror a public iCloud Shared Album into DATA_DIR."""
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    TOKEN = os.environ["ALBUM_TOKEN"].lstrip("#")
    DATA_DIR = os.environ.get("DATA_DIR", "/data")
    INTERVAL = int(os.environ.get("SYNC_INTERVAL", "1800"))
    # Any partition works as an entry point; Apple redirects us to the right one.
    ENTRY_HOST = "p23-sharedstreams.icloud.com"
    USER_AGENT = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
    GUIDS_PER_CALL = 25


    def log(message):
        print(message, flush=True)


    def post(base, path, payload):
        request = urllib.request.Request(
            "{0}/{1}".format(base, path),
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json", "User-Agent": USER_AGENT},
            method="POST",
        )
        with urllib.request.urlopen(request, timeout=60) as response:
            return json.load(response)


    def webstream():
        """Fetch album metadata, following Apple's 330 partition redirect."""
        base = "https://{0}/{1}/sharedstreams".format(ENTRY_HOST, TOKEN)
        try:
            return base, post(base, "webstream", {"streamCtag": None})
        except urllib.error.HTTPError as err:
            # urllib only auto-follows 301/302/303/307/308, so 330 lands here.
            if err.code != 330:
                raise
            host = json.loads(err.read())["X-Apple-MMe-Host"]
            base = "https://{0}/{1}/sharedstreams".format(host, TOKEN)
            log("redirected to partition {0}".format(host))
            return base, post(base, "webstream", {"streamCtag": None})


    def largest_derivative(photo):
        best = None
        for derivative in photo.get("derivatives", {}).values():
            if not derivative.get("checksum"):
                continue
            if best is None or int(derivative.get("fileSize") or 0) > int(
                best.get("fileSize") or 0
            ):
                best = derivative
        return best


    def asset_urls(base, guids):
        urls = {}
        for start in range(0, len(guids), GUIDS_PER_CALL):
            batch = guids[start:start + GUIDS_PER_CALL]
            items = post(base, "webasseturls", {"photoGuids": batch}).get("items", {})
            for checksum, item in items.items():
                urls[checksum] = "https://{0}{1}".format(
                    item["url_location"], item["url_path"]
                )
        return urls


    def download(url, path):
        request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
        tmp = path + ".part"
        with urllib.request.urlopen(request, timeout=120) as response:
            with open(tmp, "wb") as handle:
                while True:
                    chunk = response.read(65536)
                    if not chunk:
                        break
                    handle.write(chunk)
        os.replace(tmp, path)


    def write_json(path, payload):
        tmp = path + ".part"
        with open(tmp, "w") as handle:
            json.dump(payload, handle)
        os.replace(tmp, path)


    def sync():
        os.makedirs(DATA_DIR, exist_ok=True)
        base, stream = webstream()

        wanted = {}
        for photo in stream.get("photos", []):
            if photo.get("mediaAssetType") == "video":
                continue
            derivative = largest_derivative(photo)
            if not derivative:
                continue
            wanted[derivative["checksum"]] = {
                "guid": photo["photoGuid"],
                "caption": (photo.get("caption") or "").strip(),
                "created": photo.get("dateCreated")
                or photo.get("batchDateCreated")
                or "",
            }

        missing = [
            checksum
            for checksum in wanted
            if not os.path.exists(os.path.join(DATA_DIR, checksum + ".jpg"))
        ]
        if missing:
            log("downloading {0} new photo(s)".format(len(missing)))
            urls = asset_urls(base, [wanted[c]["guid"] for c in missing])
            for checksum in missing:
                url = urls.get(checksum)
                if not url:
                    log("no asset url for {0}, skipping".format(checksum))
                    continue
                download(url, os.path.join(DATA_DIR, checksum + ".jpg"))

        keep = set()
        manifest = []
        for checksum, meta in wanted.items():
            name = checksum + ".jpg"
            if not os.path.exists(os.path.join(DATA_DIR, name)):
                continue
            keep.add(name)
            manifest.append(
                {
                    "file": name,
                    "caption": meta["caption"],
                    "created": meta["created"],
                }
            )
        manifest.sort(key=lambda item: item["created"])

        for name in os.listdir(DATA_DIR):
            if name.endswith(".jpg") and name not in keep:
                os.remove(os.path.join(DATA_DIR, name))
                log("pruned {0}".format(name))

        write_json(os.path.join(DATA_DIR, "manifest.json"), manifest)
        return len(manifest)


    def main():
        once = "--once" in sys.argv
        while True:
            try:
                log("synced, {0} photo(s) available".format(sync()))
            except Exception as err:  # noqa: BLE001 - keep serving the last mirror
                print("sync failed: {0!r}".format(err), file=sys.stderr, flush=True)
                if once:
                    raise
            if once:
                return
            time.sleep(INTERVAL)


    if __name__ == "__main__":
        main()
