# Self-contained slideshow page - no build step, no framework, no CDN.
# Reads photos/manifest.json (written by the sync container), shuffles it, and
# cross-fades through it. Re-reads the manifest hourly so photos added to the
# album show up without anyone touching the tablet.
#
# Embedded by Home Assistant's built-in iframe card on the Family dashboard, and
# usable standalone at https://photos.civilsnut.se/.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: icloud-photos-web
  namespace: icloud-photos
  labels:
    app: icloud-photos
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Photos</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body {
        font: 400 clamp(13px, 1.5vw, 18px)/1.4 -apple-system, BlinkMacSystemFont,
              "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      #stage { position: fixed; inset: 0; }
      .frame { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease-in-out; }
      .frame.on { opacity: 1; }
      .frame img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .frame .bg { object-fit: cover; filter: blur(40px) brightness(.4); transform: scale(1.12); }
      .frame .fg { object-fit: contain; }
      #caption {
        position: fixed; left: 0; right: 0; bottom: 0;
        padding: 3rem 2rem 1.5rem;
        background: linear-gradient(to top, rgba(0,0,0,.6), transparent);
        opacity: 0; transition: opacity 1.5s ease-in-out; pointer-events: none;
      }
      #caption.on { opacity: 1; }
      #cap-text { font-size: 1.3em; }
      #cap-date { opacity: .65; margin-top: .15em; }
      #msg { position: fixed; inset: 0; display: grid; place-items: center; opacity: .5; }
      #msg[hidden] { display: none; }
    </style>
    </head>
    <body>
    <div id="stage"></div>
    <div id="caption"><div id="cap-text"></div><div id="cap-date"></div></div>
    <div id="msg">Loading photos…</div>
    <script>
    (function () {
      var SLIDE_MS = 15000;        // how long each photo stays up
      var FADE_MS = 1500;          // must match the CSS transition
      var MANIFEST_MS = 3600000;   // re-read the manifest hourly
      var RETRY_MS = 60000;

      var stage = document.getElementById('stage');
      var caption = document.getElementById('caption');
      var capText = document.getElementById('cap-text');
      var capDate = document.getElementById('cap-date');
      var msg = document.getElementById('msg');

      var photos = [];
      var queue = [];
      var slideTimer = null;

      function shuffle(list) {
        for (var i = list.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        }
        return list;
      }

      function src(photo) {
        return 'photos/' + encodeURIComponent(photo.file);
      }

      function formatDate(value) {
        if (!value) return '';
        var date = new Date(value);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleDateString(undefined, {
          year: 'numeric', month: 'long', day: 'numeric'
        });
      }

      function loadManifest() {
        return fetch('photos/manifest.json', { cache: 'no-store' }).then(function (res) {
          if (!res.ok) throw new Error('manifest HTTP ' + res.status);
          return res.json();
        }).then(function (next) {
          var changed = next.length !== photos.length || next.some(function (p, i) {
            return !photos[i] || p.file !== photos[i].file;
          });
          photos = next;
          if (changed) queue = [];   // reshuffle so new photos get into rotation
          return photos.length;
        });
      }

      function nextPhoto() {
        if (!queue.length) queue = shuffle(photos.slice());
        return queue.pop();
      }

      function preload(photo) {
        if (photo) { var img = new Image(); img.src = src(photo); }
      }

      function show(photo) {
        var frame = document.createElement('div');
        frame.className = 'frame';
        var bg = new Image(); bg.className = 'bg'; bg.alt = ''; bg.src = src(photo);
        var fg = new Image(); fg.className = 'fg'; fg.alt = ''; fg.src = src(photo);
        frame.appendChild(bg);
        frame.appendChild(fg);
        stage.appendChild(frame);
        // two rAFs so the browser paints opacity:0 before the class flips
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { frame.classList.add('on'); });
        });
        setTimeout(function () {
          while (stage.children.length > 1) stage.removeChild(stage.firstChild);
        }, FADE_MS + 100);

        var text = photo.caption || '';
        var date = formatDate(photo.created);
        capText.textContent = text;
        capDate.textContent = date;
        caption.classList.toggle('on', Boolean(text || date));
      }

      function tick() {
        var photo = nextPhoto();
        if (!photo) return;
        show(photo);
        preload(queue[queue.length - 1] || photos[0]);
      }

      function fail(text) {
        msg.textContent = text;
        msg.hidden = false;
        setTimeout(start, RETRY_MS);
      }

      function start() {
        loadManifest().then(function (count) {
          if (!count) { fail('No photos yet'); return; }
          msg.hidden = true;
          if (slideTimer) return;      // already running; manifest just refreshed
          tick();
          slideTimer = setInterval(tick, SLIDE_MS);
          setInterval(function () {
            loadManifest().catch(function (err) { console.warn(err); });
          }, MANIFEST_MS);
        }).catch(function (err) {
          console.warn(err);
          fail('Could not load photos');
        });
      }

      start();
    })();
    </script>
    </body>
    </html>
