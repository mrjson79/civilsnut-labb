# One pod, two containers, one RWO volume - the sync loop writes /data and nginx
# serves it. Keeping them in the same pod avoids co-scheduling gymnastics: a
# separate CronJob would have to be pinned to whichever node holds the RBD image.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icloud-photos
  namespace: icloud-photos
  labels:
    app: icloud-photos
spec:
  selector:
    matchLabels:
      app: icloud-photos
  strategy:
    type: Recreate # RWO PVC - old pod must terminate before the new one mounts
  template:
    metadata:
      labels:
        app: icloud-photos
    spec:
      nodeSelector:
        has-disk: "yes"
      containers:
        # Pulls the album every SYNC_INTERVAL seconds. Failures are logged and
        # retried; nginx keeps serving the last good mirror in the meantime.
        - name: sync
          image: python:3.13-alpine
          command:
            - python
            - /opt/sync/sync.py
          env:
            - name: DATA_DIR
              value: /data
            - name: SYNC_INTERVAL
              value: "1800"
            - name: ALBUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: icloud-album
                  key: ALBUM_TOKEN
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sync-script
              mountPath: /opt/sync
              readOnly: true
        # Stock nginx config is enough: index.html comes from the ConfigMap,
        # the photos and manifest.json from the PVC under /photos.
        - name: web
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html/photos
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: icloud-photos-data
        - name: sync-script
          configMap:
            name: icloud-photos-sync
        - name: web
          configMap:
            name: icloud-photos-web
