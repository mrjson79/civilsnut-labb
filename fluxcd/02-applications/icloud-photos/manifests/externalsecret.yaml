# Requires a 1Password item named "icloud-shared-album" in the civilsnut.se vault with:
#   token - the shared album token, i.e. everything AFTER the "#" in the
#           "Public Website" link Photos hands out
#           (https://www.icloud.com/sharedalbum/#B0xxxxxxxxxxxx -> B0xxxxxxxxxxxx)
#
# It is a capability URL - anyone holding it can read the whole album - so it is
# treated as a secret rather than baked into the manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: icloud-album
  namespace: icloud-photos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: icloud-album
    creationPolicy: Owner
  data:
    - secretKey: ALBUM_TOKEN
      remoteRef:
        key: icloud-shared-album
        property: token
