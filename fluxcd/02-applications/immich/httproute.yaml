# Two hostnames, both on the shared *.civilsnut.se wildcard (no per-app
# Certificate). DNS is manual: CNAME each to local.civilsnut.se in Cloudflare.
#
#   photos.civilsnut.se - Immich itself. No oauth2-proxy in front: Immich has
#                         real user accounts and its mobile app authenticates
#                         against them, so an ext_authz layer would only break
#                         the iOS backup client.
#   frame.civilsnut.se  - the kiosk slideshow, embedded by the Home Assistant
#                         Family dashboard. Deliberately open, like
#                         ha.civilsnut.se: a login redirect inside an iframe is
#                         blocked by the IdP's frame-ancestors policy whenever
#                         the wall tablet has no live session. LAN-only.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  hostnames:
    - photos.civilsnut.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: immich-server
          port: 2283
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-kiosk
  namespace: immich
spec:
  hostnames:
    - frame.civilsnut.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: immich-kiosk
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
