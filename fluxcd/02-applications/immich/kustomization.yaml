apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    # external-secrets for the DB password, kiosk API key and OIDC client,
    # rook-ceph for the library volume and the RGW backup bucket, cnpg for the
    # Postgres operator, shared-gateway for ingress, zitadel as the OIDC issuer
    flux.weave.works/depends-on: "external-secrets,rook-ceph,cnpg,shared-gateway,zitadel"

resources:
  - namespace.yaml
  - repository.yaml
  - manifests
  - release.yaml
  - httproute.yaml
  - referencegrant.yaml
