# S3 bucket for CNPG backups of immich-pg. Rook's bucket provisioner creates
# the bucket on the objectstore RGW and materialises, in this namespace, a
# Secret (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) and a ConfigMap
# (BUCKET_NAME/BUCKET_HOST) both named immich-pg-backups.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: immich-pg-backups
  namespace: immich
spec:
  bucketName: immich-pg-backups
  storageClassName: ceph-bucket
