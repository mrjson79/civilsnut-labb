# 1Password items in the civilsnut.se vault (both created 2026-08-10):
#
#   immich-db     field "password"  - Postgres app-user password. Rotating it
#                                     also needs an ALTER ROLE in the cluster.
#   immich-kiosk  field "api-key"   - Immich API key the kiosk reads assets
#                                     with. Created inside Immich (Account
#                                     Settings -> API Keys) after first login,
#                                     so it ships as a placeholder; the kiosk
#                                     401s until it is replaced.
---
# CNPG wants a kubernetes.io/basic-auth secret (username + password); the
# Immich chart wants the same password as a plain key for DB_PASSWORD. One
# 1Password field, one Secret, both shapes - same trick as zitadel-pg-app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-pg-app
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: immich-pg-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: immich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: immich-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-kiosk
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: immich-kiosk
    creationPolicy: Owner
  data:
    - secretKey: KIOSK_IMMICH_API_KEY
      remoteRef:
        key: immich-kiosk
        property: api-key
