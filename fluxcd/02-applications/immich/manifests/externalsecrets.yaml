# 1Password items in the civilsnut.se vault (both created 2026-08-10):
#
#   immich-db     field "password"  - Postgres app-user password. Rotating it
#                                     also needs an ALTER ROLE in the cluster.
#   immich-kiosk  field "api-key"   - Immich API key the kiosk reads assets
#                                     with. Created inside Immich (Account
#                                     Settings -> API Keys) after first login,
#                                     so it ships as a placeholder; the kiosk
#                                     401s until it is replaced.
#   immich-oidc   fields "client_id" / "client_secret" - Zitadel Application in
#                                     the homelab project. Both placeholders
#                                     until that app is created. Use the OIDC
#                                     *Client ID*, not the Application resource
#                                     id - see identity/zitadel-sso.md.
---
# CNPG wants a kubernetes.io/basic-auth secret (username + password); the
# Immich chart wants the same password as a plain key for DB_PASSWORD. One
# 1Password field, one Secret, both shapes - same trick as zitadel-pg-app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-pg-app
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: immich-pg-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: immich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: immich-db
        property: password
---
# Immich's whole system config, rendered here rather than in the HelmRelease
# because it now carries the OIDC client secret. The chart takes exactly one
# configuration resource (immich.configuration and immich.existingConfiguration
# are mutually exclusive), so storageTemplate has to live in here too.
#
# The {{y}} in storageTemplate is Immich's own placeholder syntax, not ESO's.
# It is wrapped in a Go raw-string literal so the ESO v2 template engine emits
# it verbatim instead of trying to evaluate it - without that the whole
# ExternalSecret fails to render. It is not a typo; do not "fix" it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: immich-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        immich-config.yaml: |
          storageTemplate:
            enabled: true
            template: "{{ `{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}` }}"
          oauth:
            enabled: true
            issuerUrl: https://idp.civilsnut.se
            clientId: "{{ .client_id }}"
            clientSecret: "{{ .client_secret }}"
            scope: openid email profile
            signingAlgorithm: RS256
            profileSigningAlgorithm: none
            # Zitadel supports both; this must match the Application's
            # configured auth method (choose POST in the Zitadel UI).
            tokenEndpointAuthMethod: client_secret_post
            buttonText: Sign in with Zitadel
            # Existing local accounts are matched to OIDC users by email, so
            # the admin account keeps its role when it first signs in this way.
            autoRegister: true
            # Leave the password form reachable - autoLaunch would bounce
            # straight to Zitadel with no way back if OIDC ever breaks.
            autoLaunch: false
            # The mobile app's real callback is the custom scheme
            # app.immich:///oauth-callback, which Zitadel rejects on a
            # confidential web client (zitadel/zitadel#9607). Immich ships a
            # forwarding endpoint for exactly this: register the https URL
            # below as the redirect URI instead and it hands off to the app.
            mobileOverrideEnabled: true
            mobileRedirectUri: https://photos.civilsnut.se/api/oauth/mobile-redirect
            endSessionEndpoint: https://idp.civilsnut.se/oidc/v1/end_session
            storageLabelClaim: preferred_username
          passwordLogin:
            # Deliberately still on. Turning this off is a one-way door if the
            # Zitadel client is misconfigured - do it only once OIDC login has
            # actually been proven end to end.
            enabled: true
  data:
    - secretKey: client_id
      remoteRef:
        key: immich-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: immich-oidc
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-kiosk
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: immich-kiosk
    creationPolicy: Owner
  data:
    - secretKey: KIOSK_IMMICH_API_KEY
      remoteRef:
        key: immich-kiosk
        property: api-key
