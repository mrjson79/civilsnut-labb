apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset
      tolerations:
        - operator: Exists # run on every node, incl. control-plane
      # Host mounts so the embedded node_exporter reads host state, not the
      # container's
      hostPID: true
      volumes:
        extra:
          - name: proc
            hostPath:
              path: /proc
          - name: sys
            hostPath:
              path: /sys
          - name: root
            hostPath:
              path: /

    alloy:
      mounts:
        extra:
          - name: proc
            mountPath: /host/proc
            readOnly: true
          - name: sys
            mountPath: /host/sys
            readOnly: true
          - name: root
            mountPath: /host/root
            readOnly: true
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 384Mi
          cpu: 200m
      configMap:
        create: true
        content: |
          // ---- LOGS: all pod logs on this node -> Loki (via kubelet API) ----
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            // Containers whose entire output is content-free. Dropping the TARGET
            // means no kubelet log stream is ever opened for them: no CPU, no
            // bytes, no Loki stream. rook's log-collector sidecar runs on every
            // ceph daemon pod and only ever prints logrotate chatter
            // ("log does not need rotating ...", "+ sleep 15m") every 15m.
            // Init containers are deliberately NOT dropped - rook's OSD init
            // containers (activate / expand-bluefs / chown) are the only record
            // of why an OSD failed to start.
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              regex         = "rook-ceph/(log-collector|liveness-prometheus|driver-registrar)"
              action        = "drop"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }
          }

          loki.source.kubernetes "pods" {
            targets = discovery.relabel.pods.output
            // loki.source.kubernetes accepts no stage.* blocks, so all line-level
            // filtering and enrichment lives in loki.process below.
            forward_to = [loki.process.kube.receiver]
          }

          // This component sits in the path of EVERY log line in the cluster, so
          // every stage is wrapped in a stage.match scoped to a namespace. A
          // loki.process whose stages do not match is a pure pass-through, which
          // is what keeps all other namespaces untouched.
          loki.process "kube" {
            forward_to = [loki.write.default.receiver]

            // ---- rook-ceph noise, ~76% of that namespace's lines ----
            // The selector's !~ is a safety net over ALL the drops below: a line
            // that looks like a problem is never dropped, whatever pattern it
            // otherwise matches. This is what keeps e.g.
            // "4 rocksdb: Corruption: bad block contents" (which the rocksdb drop
            // would otherwise swallow) and lets pgmap [DBG] lines through while
            // PGs are degraded. RE2 has no negative lookahead, so this cannot be
            // expressed inside the drop expressions themselves.
            //
            // Measured shares of the namespace's 77k lines/h before filtering:
            //   [DBG] audit/cluster/log_channel  47.7%
            //   " 4 rocksdb: " (debug level 4)   17.6%
            //   rocksdb stats block (bare lines)  ~8%
            //   _set_new_cache_sizes (mon)        2.6%
            //   mgr's "osd blocklist ls" poll     2.5%
            //
            // NOTE: patterns are ^-anchored but never $-anchored - stored entries
            // carry a trailing newline, so a $ anchor silently matches nothing.
            //
            // The selector is a River RAW string (backticks) and every LogQL
            // literal inside it is DOUBLE-QUOTED. The match stage's embedded
            // LogQL parser rejects backtick literals outright ("unexpected
            // IDENTIFIER, expecting STRING"), and a component that fails to
            // build is never created - which silently black-holes every log line
            // in the cluster, not just this namespace. `alloy validate` does NOT
            // catch it (it checks schema, not component build), so changes here
            // must be tested with a real `alloy run`.
            stage.match {
              selector = `{namespace="rook-ceph"} !~ "(?i)(corrupt|error|fail|assert|abort|caught signal|slow op|damag|inconsisten|degraded|unfound|no reply|timed? ?out|\\[WRN\\]|\\[ERR\\])"`

              // debug-channel messages: audit cmd dispatch, pgmap dumps, and the
              // liveness probe's mon_status calls
              stage.drop {
                expression          = "\\[DBG\\]"
                drop_counter_reason = "ceph_debug_channel"
              }
              // rocksdb's own debug output (debug_rocksdb defaults to 4/5)
              stage.drop {
                expression          = " 4 rocksdb: "
                drop_counter_reason = "ceph_rocksdb_debug"
              }
              // mon cache housekeeping, every ~2s per mon
              stage.drop {
                expression          = "_set_new_cache_sizes"
                drop_counter_reason = "ceph_mon_cache_sizes"
              }
              // mgr polls the blocklist every ~10s; the matching audit line is
              // already dropped above
              stage.drop {
                expression          = "handle_command mon_command\\(\\{\"prefix\": \"osd blocklist ls\""
                drop_counter_reason = "ceph_mon_blocklist_poll"
              }
              // The periodic rocksdb stats dump is written as one multi-line
              // block, so containerd splits it: the first line keeps the ceph
              // prefix (dropped above) and the rest arrive bare. Every pattern
              // below is ^-anchored, which makes it impossible to match a real
              // ceph log line - those always start with a channel word
              // (debug/audit/cluster). Do NOT generalise this to "drop anything
              // without a ceph prefix": crash backtraces ("*** Caught signal",
              // stack frames, "-- begin dump of recent events --") are bare too,
              // and they are the whole reason logs exist.
              stage.drop {
                expression          = "^\\*\\* "
                drop_counter_reason = "ceph_rocksdb_stats_header"
              }
              stage.drop {
                expression          = "^Block cache"
                drop_counter_reason = "ceph_rocksdb_blockcache"
              }
              stage.drop {
                expression          = "^(Uptime\\(secs\\)|Cumulative|Interval|Flush\\(GB\\)|AddFile|Stalls\\(count\\)|Blob file|Estimated pending|Write Stall|Read Amp|Count:|Min:|Average:|Percentiles:|Priority|Level +Files|\\[ *[0-9])"
                drop_counter_reason = "ceph_rocksdb_stats_row"
              }
              stage.drop {
                expression          = "^ *(L[0-9]+|Sum|Int|Low|High|User) +[0-9]+/[0-9]+ "
                drop_counter_reason = "ceph_rocksdb_stats_table"
              }
              stage.drop {
                expression          = "^-{10,}"
                drop_counter_reason = "ceph_rocksdb_stats_sep"
              }
            }

            // ---- severity + daemon as structured metadata, NOT labels ----
            // Labels define streams in Loki: promoting a 4-value severity would
            // multiply this namespace's streams for no query benefit, and
            // ceph_daemon is a bijection with the existing pod label. Structured
            // metadata is filterable without a parser stage
            // ({namespace="rook-ceph"} | level="error") and needs schema v13+tsdb,
            // which loki.yaml already uses.
            //
            // Ceph emits two line formats:
            //   A  debug <ts> <thread> <numeric level> <message>
            //   B  <channel> <ts> <entity> (<id>) <seq> : <channel> [LEVEL] <msg>
            // Each regex is guarded by a selector that guarantees it matches, so
            // empty-valued metadata is never attached. Key is "level", not
            // "detected_level" - Loki injects that itself and would guess
            // "unknown", since ceph encodes format-A severity numerically.
            stage.match {
              selector = `{namespace="rook-ceph"} |~ "\\[(INF|WRN|ERR)\\]"`

              stage.regex {
                expression = "\\[(?P<ceph_channel_level>INF|WRN|ERR)\\]"
              }
              // NOTE the odd-looking escapes below. The alloy chart pipes this
              // whole config through Helm's `tpl`, so a bare Go-template opening
              // brace pair anywhere in this file - including in a comment - is
              // parsed as a Helm action and fails the release. Helm renders the
              // escapes back to plain braces before Alloy ever sees the file.
              stage.template {
                source   = "level"
                template = "{{ "{{" }} if eq .ceph_channel_level \"ERR\" }}error{{ "{{" }} else if eq .ceph_channel_level \"WRN\" }}warn{{ "{{" }} else }}info{{ "{{" }} end }}"
              }
              stage.structured_metadata {
                values = {
                  level = "level",
                }
              }
            }

            stage.match {
              selector = `{namespace="rook-ceph"} |~ "^debug [0-9T:.+-]+ [0-9a-f]+ +-?[0-9]+ "`

              stage.regex {
                expression = "^debug \\S+ +[0-9a-f]+ +(?P<ceph_debug_level>-?[0-9]+) "
              }
              // ceph's format-A severity is the message's own debug level:
              // -1 = error, 0 = the normal/notable level, >= 1 = debug detail.
              // Escaped braces again: see the note above - Helm tpl processes this file.
              stage.template {
                source   = "level"
                template = "{{ "{{" }} if eq .ceph_debug_level \"-1\" }}error{{ "{{" }} else if eq .ceph_debug_level \"0\" }}info{{ "{{" }} else }}debug{{ "{{" }} end }}"
              }
              stage.structured_metadata {
                values = {
                  level            = "level",
                  ceph_debug_level = "ceph_debug_level",
                }
              }
            }

            // Same key and values as the Prometheus ceph_daemon label, so one
            // Grafana variable can drive both the logs and the metrics panels.
            stage.match {
              selector = `{namespace="rook-ceph"} |~ "(osd|mon|mgr|mds|rgw|client)\\.[a-z0-9]+"`

              stage.regex {
                expression = "(?P<ceph_daemon>(osd|mon|mgr|mds|rgw|client)\\.[a-z0-9]+)"
              }
              stage.structured_metadata {
                values = {
                  ceph_daemon = "ceph_daemon",
                }
              }
            }

            // ---- ceph error lines as a Prometheus counter ----
            // Alloy's ServiceMonitor already scrapes this, arriving as
            // loki_process_custom_ceph_log_error_lines_total - so log-derived
            // alerting goes through the existing Prometheus/Alertmanager path
            // instead of standing up the Loki ruler.
            //
            // Matched with a LINE FILTER, not `| level = "error"`: the match
            // stage's LogQL parser accepts only |= != |~ !~ and rejects label
            // filters outright, so referencing the structured metadata set above
            // would fail the component build. The two alternatives are the
            // format-B [ERR] channel tag and a format-A debug level of -1.
            stage.match {
              selector = `{namespace="rook-ceph"} |~ "(\\[ERR\\]|^debug \\S+ +[0-9a-f]+ +-1 )"`

              stage.metrics {
                metric.counter {
                  name              = "ceph_log_error_lines"
                  description       = "ceph daemon log lines at error severity"
                  action            = "inc"
                  match_all         = true
                  max_idle_duration = "1h"
                }
              }
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
            external_labels = {
              cluster = "omni-cluster",
            }
          }

          // ---- METRICS: embedded node_exporter -> Prometheus remote_write ----
          prometheus.exporter.unix "node" {
            procfs_path    = "/host/proc"
            sysfs_path     = "/host/sys"
            rootfs_path    = "/host/root"
            udev_data_path = "/host/root/run/udev/data"
          }

          prometheus.scrape "node" {
            targets         = prometheus.exporter.unix.node.targets
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.node.receiver]
          }

          prometheus.relabel "node" {
            forward_to = [prometheus.remote_write.default.receiver]

            // keep job/instance compatible with kube-prometheus-stack's
            // node-exporter dashboards and recording rules
            rule {
              target_label = "job"
              replacement  = "node-exporter"
            }
            rule {
              target_label = "instance"
              replacement  = sys.env("NODE_NAME")
            }
          }

          prometheus.remote_write "default" {
            endpoint {
              url = "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"
            }
          }

    serviceMonitor:
      enabled: true
