apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "1.10.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset
      tolerations:
        - operator: Exists # run on every node, incl. control-plane
      # Host mounts so the embedded node_exporter reads host state, not the
      # container's
      hostPID: true
      volumes:
        extra:
          - name: proc
            hostPath:
              path: /proc
          - name: sys
            hostPath:
              path: /sys
          - name: root
            hostPath:
              path: /

    alloy:
      mounts:
        extra:
          - name: proc
            mountPath: /host/proc
            readOnly: true
          - name: sys
            mountPath: /host/sys
            readOnly: true
          - name: root
            mountPath: /host/root
            readOnly: true
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 384Mi
          cpu: 200m
      configMap:
        create: true
        content: |
          // ---- LOGS: all pod logs on this node -> Loki (via kubelet API) ----
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
            external_labels = {
              cluster = "omni-cluster",
            }
          }

          // ---- METRICS: embedded node_exporter -> Prometheus remote_write ----
          prometheus.exporter.unix "node" {
            procfs_path    = "/host/proc"
            sysfs_path     = "/host/sys"
            rootfs_path    = "/host/root"
            udev_data_path = "/host/root/run/udev/data"
          }

          prometheus.scrape "node" {
            targets         = prometheus.exporter.unix.node.targets
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.node.receiver]
          }

          prometheus.relabel "node" {
            forward_to = [prometheus.remote_write.default.receiver]

            // keep job/instance compatible with kube-prometheus-stack's
            // node-exporter dashboards and recording rules
            rule {
              target_label = "job"
              replacement  = "node-exporter"
            }
            rule {
              target_label = "instance"
              replacement  = sys.env("NODE_NAME")
            }
          }

          prometheus.remote_write "default" {
            endpoint {
              url = "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"
            }
          }

    serviceMonitor:
      enabled: true
