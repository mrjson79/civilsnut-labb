apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: kube-prometheus-stack-grafana
    release: kube-prometheus-stack
data:
  ceph-logs.json: |
    {
      "uid": "ceph-logs",
      "title": "Ceph Logs",
      "tags": [
        "ceph",
        "rook",
        "logs"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "container",
            "label": "Container",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${DS_LOKI}"
            },
            "query": {
              "label": "container",
              "stream": "{namespace=\"rook-ceph\"}",
              "type": 2
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "search",
            "label": "Contains",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "title": "Health",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "title": "Error lines (range)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum(count_over_time({namespace=\"rook-ceph\"} | level = `error` [$__range]))",
              "refId": "A",
              "queryType": "instant",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Daemons logging errors",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "count(sum by (ceph_daemon) (count_over_time({namespace=\"rook-ceph\"} | level = `error` [$__range])))",
              "refId": "A",
              "queryType": "instant",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Crash / assert lines",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum(count_over_time({namespace=\"rook-ceph\"} |~ `(?i)(caught signal|ceph_assert|FAILED assert|Segmentation fault)` [$__range]))",
              "refId": "A",
              "queryType": "instant",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Top Ceph health-check codes",
          "type": "barchart",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "topk(10, sum by (code) (count_over_time({namespace=\"rook-ceph\"} |~ `Health check` | regexp `\\((?P<code>[A-Z_]{4,})\\)` [$__range])))",
              "refId": "A",
              "queryType": "instant",
              "legendFormat": "{{code}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "legend": {
              "showLegend": false
            },
            "xTickLabelRotation": 0,
            "showValue": "auto"
          },
          "description": "Parsed from 'Health check failed/update' lines - the code in parentheses, e.g. OSD_DOWN, SLOW_OPS, PG_DAMAGED."
        },
        {
          "id": 5,
          "title": "Errors and warnings by daemon",
          "type": "timeseries",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum by (ceph_daemon, level) (count_over_time({namespace=\"rook-ceph\"} | level =~ `error|warn` [$__auto]))",
              "refId": "A",
              "queryType": "range",
              "legendFormat": "{{ceph_daemon}} {{level}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 0
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 101,
          "title": "Volume",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 6,
          "title": "Log volume by container",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum by (container) (count_over_time({namespace=\"rook-ceph\"}[$__auto]))",
              "refId": "A",
              "queryType": "range",
              "legendFormat": "{{container}}"
            }
          ],
          "description": "Proves the Alloy filtering works: the log-collector and RocksDB mass disappears from history as the 7d retention rolls forward.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 0
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "title": "Noise dropped by Alloy (per reason)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (reason) (rate(loki_process_dropped_lines_total[$__rate_interval]))",
              "refId": "A",
              "queryType": "range",
              "legendFormat": "{{reason}}"
            }
          ],
          "description": "What the pipeline discards and at what rate. If this drops to zero while log volume climbs, a Ceph upgrade changed the RocksDB output format and the drop patterns need revisiting.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 0
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "title": "Known failure signatures",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum(count_over_time({namespace=\"rook-ceph\"} |~ `slow (request|ops)` [$__auto]))",
              "refId": "A",
              "queryType": "range",
              "legendFormat": "slow ops"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum(count_over_time({namespace=\"rook-ceph\"} |= \"heartbeat_check: no reply\" [$__auto]))",
              "refId": "B",
              "queryType": "range",
              "legendFormat": "heartbeat no reply"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum(count_over_time({namespace=\"rook-ceph\"} |~ `(scrub .*(error|mismatch)|inconsistent)` [$__auto]))",
              "refId": "C",
              "queryType": "range",
              "legendFormat": "scrub errors"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "sum(count_over_time({namespace=\"rook-ceph\"} |~ `(?i)(caught signal|ceph_assert|FAILED assert|Segmentation fault)` [$__auto]))",
              "refId": "D",
              "queryType": "range",
              "legendFormat": "crash/assert"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 0
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 102,
          "title": "Logs",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "title": "Ceph errors and warnings",
          "type": "logs",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "{namespace=\"rook-ceph\", container=~\"$container\"} | level =~ `error|warn` |= \"$search\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "description": "An empty $search renders |= \"\" which is valid LogQL matching every line - intentional.",
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "exact",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 10,
          "title": "Crash / assert dumps",
          "type": "logs",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "{namespace=\"rook-ceph\"} |~ `(?i)(caught signal|ceph_assert|FAILED assert|begin dump of recent events|Segmentation fault)`",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "description": "No level filter: crash backtraces arrive as bare continuation lines carrying no severity.",
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "exact",
            "sortOrder": "Descending"
          }
        }
      ],
      "links": [
        {
          "title": "Ceph metrics dashboards",
          "type": "dashboards",
          "tags": [
            "ceph"
          ],
          "asDropdown": true,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        }
      ]
    }
