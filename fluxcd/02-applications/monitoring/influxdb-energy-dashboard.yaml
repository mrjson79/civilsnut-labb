              },
              "query": "grid = from(bucket: \"home_assistant\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"W\" and r._field == \"value\")\n  |> filter(fn: (r) => r.entity_id == \"electricity_meter_grid_import_power\" or r.entity_id == \"electricity_meter_grid_export_power\")\n  |> map(fn: (r) => ({r with\n      _value: if r.entity_id == \"electricity_meter_grid_export_power\" then -r._value else r._value,\n      series: if r.entity_id == \"electricity_meter_grid_import_power\" then \"grid import\" else \"grid export\"}))\n  |> keep(columns: [\"_time\", \"_value\", \"series\"])\n  |> group(columns: [\"series\"])\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> keep(columns: [\"_time\", \"_value\", \"series\"])\n\nsolar = from(bucket: \"home_assistant\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"W\" and r._field == \"value\" and r.entity_id =~ /^solis_.*_inverter_dc_power_pv[1-4]$/)\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> group(columns: [\"_time\"])\n  |> sum(column: \"_value\")\n  |> group()\n  |> map(fn: (r) => ({_time: r._time, _value: r._value, series: \"solar\"}))\n  |> group(columns: [\"series\"])\n\nunion(tables: [grid, solar])",
