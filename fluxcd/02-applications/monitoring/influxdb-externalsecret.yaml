# Requires a 1Password item named "influxdb" in the civilsnut.se vault with:
#   admin-password  - openssl rand -base64 24 (InfluxDB UI login for user admin)
#   admin-token     - openssl rand -hex 32    (API/operator token)
---
# Bootstrap credentials for the influxdb2 chart (adminUser.existingSecret).
# The chart expects exactly these two key names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: influxdb-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: influxdb-auth
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: influxdb
        property: admin-password
    - secretKey: admin-token
      remoteRef:
        key: influxdb
        property: admin-token
---
# Same token under an env-var-safe key, injected into Grafana via
# envFromSecrets and expanded with $__env{INFLUXDB_TOKEN} in the
# influxdb-grafana-datasource ConfigMap. Kept separate from influxdb-auth so
# envFromSecrets does not also inject admin-password (hyphenated keys break
# $__env{} interpolation anyway).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-influxdb-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: grafana-influxdb-token
    creationPolicy: Owner
  data:
    - secretKey: INFLUXDB_TOKEN
      remoteRef:
        key: influxdb
        property: admin-token
