# DNS: manual CNAME influxdb.civilsnut.se -> local.civilsnut.se in Cloudflare
# (no external-dns). The monitoring namespace is already covered by the
# grafana-to-shared-gateway ReferenceGrant - grants are per source namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: influxdb2
    app.kubernetes.io/component: monitoring
spec:
  hostnames:
    - influxdb.civilsnut.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: influxdb-influxdb2
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
