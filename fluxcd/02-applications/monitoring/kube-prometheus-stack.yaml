apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  timeout: 35m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.1.5"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    prometheusOperator:
      nodeSelector:
        has-disk: "yes"
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

    prometheus:
      prometheusSpec:
        # Select ALL ServiceMonitors/PodMonitors/Rules cluster-wide regardless of
        # helm release labels (replaces VM's selectAllByDefault: true)
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeInterval: 30s
        externalLabels:
          cluster: omni-cluster
        retention: 30d
        retentionSize: 45GB
        # Alloy pushes node metrics via remote_write
        enableRemoteWriteReceiver: true
        # NOTE: no additionalScrapeConfigs. The old vm-stack-era
        # "cilium-agent-additional" raw job rewrote every cilium pod port to
        # 9965 - the hubble metrics port - so it scraped the same endpoint as
        # the hubble-metrics ServiceMonitor (double-counting every hubble
        # metric) and permanently fired TargetDown on its 9 dead
        # non-hubble-port targets.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi
        nodeSelector:
          has-disk: "yes"
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m

    alertmanager:
      enabled: true
      # Replaces the chart's default (null-routed) config wholesale, so the
      # standard severity inhibit rules are restated below.
      config:
        route:
          receiver: "null"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            # critical only -> Signal (via signal-relay -> signal-api)
            - receiver: signal
              matchers:
                - severity = "critical"
        receivers:
          - name: "null"
          - name: signal
            webhook_configs:
              - url: http://signal-relay.monitoring.svc.cluster.local:10000/api/v3/alertmanager
                send_resolved: true
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - alertname = "InfoInhibitor"
            target_matchers:
              - severity = "info"
            equal: ["namespace"]
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        nodeSelector:
          has-disk: "yes"
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 200m

    grafana:
      enabled: true
      deploymentStrategy:
        type: Recreate # RWO PVC - old pod must terminate before the new one mounts
      persistence:
        enabled: true
        storageClassName: ceph-block
        size: 10Gi
        accessModes:
          - ReadWriteOnce
      envFromSecrets:
        - name: grafana-oidc
        # INFLUXDB_TOKEN for the InfluxDB-HA datasource ($__env{} expansion
        # in influxdb-datasource.yaml)
        - name: grafana-influxdb-token
      env:
        # Hardcoded GrafanaAdmin for every Zitadel login (single-admin
        # homelab). Follow-up: map the Zitadel roles claim
        # (urn:zitadel:iam:org:project:roles, requires "Assert Roles on
        # Authentication" on the homelab project) via JMESPath instead.
        # MUST be an env var: the grafana.ini parser strips the
        # surrounding quotes, turning the JMESPath string literal into a
        # claim lookup that returns null (role falls back to Viewer).
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'GrafanaAdmin'"
      grafana.ini:
        server:
          # Served at the domain root behind the shared gateway - root_url must
          # match the public URL or Grafana fails to load its application files.
          # No subpath in play, so serve_from_sub_path stays false.
          root_url: https://grafana.civilsnut.se/
          serve_from_sub_path: false
        auth.generic_oauth:
          enabled: true
          name: Zitadel
          allow_sign_up: true
          auto_login: true
          client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid email profile
          # userinfo is /oidc/v1/, not /oauth/v2/ - the wrong one makes
          # Grafana fall back to a GitHub-style /emails URL -> opaque error
          auth_url: https://idp.civilsnut.se/oauth/v2/authorize
          token_url: https://idp.civilsnut.se/oauth/v2/token
          api_url: https://idp.civilsnut.se/oidc/v1/userinfo
          use_pkce: true
          allow_assign_grafana_admin: true
        auth.basic:
          enabled: false
      sidecar:
        dashboards:
          enabled: true
        datasources:
          enabled: true
      # dotdc Kubernetes dashboards (https://github.com/dotdc/grafana-dashboards-kubernetes)
      # downloaded by the download-dashboards init container at pod start
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: dotdc
              orgId: 1
              folder: Kubernetes
              type: file
              disableDeletion: false
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards/dotdc
            # Official ceph-mixin dashboards, generated from the same source
            # tree as the running Ceph, so metric names match by construction.
            - name: ceph
              orgId: 1
              folder: Ceph
              type: file
              disableDeletion: false
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards/ceph
            # Official Cilium dashboards, shipped in the cilium repo and pinned
            # to the deployed version (00-foundation/cilium/release.yaml).
            - name: cilium
              orgId: 1
              folder: Cilium
              type: file
              disableDeletion: false
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards/cilium
      dashboards:
        dotdc:
          k8s-views-global:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          k8s-views-namespaces:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          k8s-views-nodes:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          k8s-views-pods:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          k8s-system-api-server:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
          k8s-system-coredns:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
          k8s-addons-prometheus:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-addons-prometheus.json
          # All PVCs with capacity/used/available/% in one table
          # (kubelet_volume_stats_*)
          pvc-usage-cluster:
            gnetId: 11454
            revision: 14
            datasource: Prometheus
        # Pinned to the running Ceph version (cephImage.tag in
        # 01-infrastructure/rook-ceph/cluster-release.yaml) - bump both together
        # or the dashboards drift from the metric names. They require the
        # cluster="rook-ceph" label that the rook-operator-managed
        # ServiceMonitors relabel in; do NOT add a `datasource:` key, $datasource
        # already resolves to the default Prometheus.
        # Not included: cephfs-overview / radosgw-* (not deployed),
        # hosts-overview / host-details (duplicate dotdc k8s-views-nodes),
        # rbd-overview / rbd-details (empty unless mgr/prometheus/rbd_stats_pools
        # is set, which costs mgr CPU per RBD image).
        ceph:
          ceph-cluster:
            url: https://raw.githubusercontent.com/ceph/ceph/v20.2.2/monitoring/ceph-mixin/dashboards_out/ceph-cluster.json
          ceph-cluster-advanced:
            url: https://raw.githubusercontent.com/ceph/ceph/v20.2.2/monitoring/ceph-mixin/dashboards_out/ceph-cluster-advanced.json
          ceph-osds-overview:
            url: https://raw.githubusercontent.com/ceph/ceph/v20.2.2/monitoring/ceph-mixin/dashboards_out/osds-overview.json
          ceph-osd-device-details:
            url: https://raw.githubusercontent.com/ceph/ceph/v20.2.2/monitoring/ceph-mixin/dashboards_out/osd-device-details.json
          ceph-pool-overview:
            url: https://raw.githubusercontent.com/ceph/ceph/v20.2.2/monitoring/ceph-mixin/dashboards_out/pool-overview.json
        # Pinned to the deployed cilium chart version - bump together with
        # 00-foundation/cilium/release.yaml. DS_PROMETHEUS in these is a
        # datasource-type template var, so it resolves on its own.
        # The namespace/workload-scoped hubble dashboards depend on the
        # labelsContext options set on hubble.metrics in the cilium values;
        # the DNS one additionally stays empty until cilium's DNS proxy
        # observes queries (toFQDNs policy / DNS visibility).
        cilium:
          cilium-agent:
            url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0/install/kubernetes/cilium/files/cilium-agent/dashboards/cilium-dashboard.json
          cilium-operator:
            url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0/install/kubernetes/cilium/files/cilium-operator/dashboards/cilium-operator-dashboard.json
          hubble:
            url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0/install/kubernetes/cilium/files/hubble/dashboards/hubble-dashboard.json
          hubble-dns-namespace:
            url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0/install/kubernetes/cilium/files/hubble/dashboards/hubble-dns-namespace.json
          hubble-network-overview-namespace:
            url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0/install/kubernetes/cilium/files/hubble/dashboards/hubble-network-overview-namespace.json
          hubble-l7-http-metrics-by-workload:
            url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0/install/kubernetes/cilium/files/hubble/dashboards/hubble-l7-http-metrics-by-workload.json
      nodeSelector:
        has-disk: "yes"
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 200m

    # Node metrics come from Alloy's embedded node_exporter (remote_write)
    nodeExporter:
      enabled: false

    kubeStateMetrics:
      enabled: true

    kube-state-metrics:
      # Standard collectors enabled (unlike vm-stack's custom-resource-state-only
      # setup) so kube_pod_*/kube_deployment_* metrics exist for the bundled
      # dashboards and rules; the CRS config adds Gateway API + Flux metrics.
      extraArgs:
        - --custom-resource-state-config-file=/etc/customresourcestate/kube-state-metrics-config.yaml
      rbac:
        extraRules:
          - apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways", "httproutes", "grpcroutes", "tcproutes", "tlsroutes", "udproutes", "gatewayclasses"]
            verbs: ["list", "watch"]
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources: ["gitrepositories", "buckets", "helmrepositories", "helmcharts", "ocirepositories"]
            verbs: ["list", "watch"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
          - apiGroups: ["notification.toolkit.fluxcd.io"]
            resources: ["providers", "alerts", "receivers"]
            verbs: ["list", "watch"]
          - apiGroups: ["image.toolkit.fluxcd.io"]
            resources: ["imagepolicies", "imagerepositories", "imageupdateautomations"]
            verbs: ["list", "watch"]
      volumeMounts:
        - name: flux-kube-state-metrics-config
          mountPath: /etc/customresourcestate
          readOnly: true
      volumes:
        - name: flux-kube-state-metrics-config
          configMap:
            name: flux-kube-state-metrics-config
      nodeSelector:
        has-disk: "yes"

    # etcd metrics exposed via Omni ConfigPatch (talos/patches/etcd-metrics-omni.yaml):
    # plain HTTP on :2381 on the control-plane nodes
    kubeEtcd:
      enabled: true
      endpoints:
        - 192.168.1.248 # ctlr-01
        - 192.168.1.250 # ctlr-02
        - 192.168.1.79 # ctlr-03
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http
    # Talos does not expose these control-plane metrics endpoints; keep the
    # scrapes and rules off to avoid permanent TargetDown alerts.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false # kube-proxy replaced by Cilium anyway

    defaultRules:
      create: true
      rules:
        etcd: true
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
        windows: false
