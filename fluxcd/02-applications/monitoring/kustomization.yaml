apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: infrastructure
  annotations:
    # Depends on rook-ceph for storage and shared-gateway for ingress
    flux.weave.works/depends-on: "rook-ceph,shared-gateway"

resources:
  - namespace.yaml
  - repositories.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - alloy.yaml
  - grafana-oidc-externalsecret.yaml
  - loki-datasource.yaml
  - influxdb.yaml
  - influxdb-externalsecret.yaml
  - influxdb-datasource.yaml
  - influxdb-energy-dashboard.yaml
  - influxdb-httproute.yaml
  - httproute.yaml
  - referencegrant.yaml
  - configs
  - service-monitors
