apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    # The old VictoriaMetrics datasources were imported into grafana.db during
    # the vm-stack migration window (uninstall hook failure); provisioned
    # datasources are never auto-removed when their file disappears, so they
    # are deleted explicitly here (no-op once gone).
    deleteDatasources:
      - name: VictoriaMetrics
        orgId: 1
      - name: VictoriaLogs
        orgId: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc:3100
        access: proxy
