apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    # NOTE: deleteDatasources is FATAL in Grafana 13 if the named datasource
    # does not exist (provisioning module fails, pod crashloops) - do not add
    # entries here without confirming the exact name in grafana.db first.
    datasources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc:3100
        access: proxy
