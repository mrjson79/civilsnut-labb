# Requires a 1Password item named "signal-relay" in the civilsnut.se vault with:
#   number     - Signal account number in E.164 (the linked account)
#   recipient  - destination number (same as number -> Note-to-Self)
#
# Rendered into the relay's config.yaml so phone numbers stay out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signal-relay-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: signal-relay-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            port: 10000
            debug: false
          signal:
            number: "{{ .number }}"
            recipients:
              - "{{ .recipient }}"
            send: http://signal-api.monitoring.svc.cluster.local:8080/v2/send
          alertmanager:
            generatorURL: true
  data:
    - secretKey: number
      remoteRef:
        key: signal-relay
        property: number
    - secretKey: recipient
      remoteRef:
        key: signal-relay
        property: recipient
